name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 固定 Flutter 版本：3.44.x 的 Dart 为 3.12，满足 pubspec.lock 的 SDK 约束；
      # 同时它的 Gradle 最低要求是 8.7（并且 8.14 以下才警告），与本项目
      # Gradle 8.14 / AGP 8.11.1 / Kotlin 2.2.20 完全匹配。
      # 若改用 channel: stable，会拉到 3.50+，要求 Gradle >= 9.3.1 而构建失败。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      # 固定签名：仓库内提交的是 keystore 的 base64 文本，构建前还原成文件。
      # 这样每次构建签名一致，后续版本可直接覆盖安装（升级）。
      - name: Restore signing keystore
        run: base64 -d android/abts-release.keystore.b64 > android/app/abts-release.keystore

      - name: Read version from pubspec
        id: ver
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Flutter pub get
        run: flutter pub get

      # 静态检查不阻断发布，仅把问题打印到日志便于排查
      - name: Flutter analyze
        continue-on-error: true
        run: flutter analyze

      # 车机布局验收：1920x720 下的状态栏避让、字号、封面列数、即时生效
      - name: Flutter test
        run: flutter test

      - name: Build release APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          V="v${{ steps.ver.outputs.version }}"
          mv app-arm64-v8a-release.apk "abts-$V-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "abts-$V-armeabi-v7a.apk"
          mv app-x86_64-release.apk "abts-$V-x86_64.apk"
          mv app-release.apk "abts-$V-universal.apk"
          ls -lh *.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: abts-apk-v${{ steps.ver.outputs.version }}
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 阿B听书 v${{ steps.ver.outputs.version }}
          body: |
            ## 车机适配（本次更新）

            - **外观模式新增「使用设备」**：可选「手机 / 平板」或「车机」。选择车机后应用自动关闭并重启，套用宽屏侧栏布局，并默认预留顶部状态栏空间。
            - **新增「屏幕缩放与边距调整」**（我的 → 外观模式 → 屏幕缩放与边距调整）：
              - 缩放：整体字体、按钮、列表尺寸，70%~140%
              - 字号：单独调节文字大小，80%~200%
              - 封面尺寸：单独调节书籍卡片封面，60%~130%
              - 屏幕上/下/左/右边距：按屏幕百分比留白，避开被车机状态栏遮挡的内容，0%~30%
            - 所有调整**即时生效**，无需重启；可一键「恢复默认」。

            ## 安装说明

            - 包名保持 `dev.pages.abts`，签名固定，后续版本可直接覆盖升级。
            - 首次从官方版切换到本构建时，因签名不同需先卸载旧版本（本地书架与进度会清空）。
            - 车机请优先下载 `arm64-v8a`；不确定架构时选 `universal`。

            通用包：`abts-v${{ steps.ver.outputs.version }}-universal.apk`
          files: build/app/outputs/flutter-apk/*.apk
          fail_on_unmatched_files: true
