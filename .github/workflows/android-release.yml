name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    # 文档类改动不必重新打包发布
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 固定 Flutter 版本：3.44.x 的 Dart 为 3.12，满足 pubspec.lock 的 SDK 约束；
      # 同时它的 Gradle 最低要求是 8.7（并且 8.14 以下才警告），与本项目
      # Gradle 8.14 / AGP 8.11.1 / Kotlin 2.2.20 完全匹配。
      # 若改用 channel: stable，会拉到 3.50+，要求 Gradle >= 9.3.1 而构建失败。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      # 固定签名：仓库内提交的是 keystore 的 base64 文本，构建前还原成文件。
      # 这样每次构建签名一致，后续版本可直接覆盖安装（升级）。
      - name: Restore signing keystore
        run: base64 -d android/abts-release.keystore.b64 > android/app/abts-release.keystore

      - name: Read version from pubspec
        id: ver
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Flutter pub get
        run: flutter pub get

      # 静态检查：能提前暴露打包时才报的编译错误（如漏掉 import）
      - name: Flutter analyze
        run: flutter analyze

      # 车机布局验收：1920x720 下的状态栏避让、字号、封面列数、即时生效
      - name: Flutter test
        run: flutter test

      - name: Build release APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          V="v${{ steps.ver.outputs.version }}"
          mv app-arm64-v8a-release.apk "abts_car-$V-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "abts_car-$V-armeabi-v7a.apk"
          mv app-x86_64-release.apk "abts_car-$V-x86_64.apk"
          mv app-release.apk "abts_car-$V-universal.apk"
          ls -lh *.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: abts-apk-v${{ steps.ver.outputs.version }}
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 阿B听书 v${{ steps.ver.outputs.version }}
          update_existing: true
          replace_existing_assets: true
          body: |
            ## 车机专用版 v${{ steps.ver.outputs.version }}

            本仓库为「阿B听书」车机专用分支，只适配 Android 车机中控。

            ### 适配范围

            - **最低 Android 7.0（API 24）**，覆盖停留在 7.0~9.0 的车机与车机盒子
            - 12~18 寸中控，720P ~ 2.5K 横屏（已在 Android 11 / 1920×720 验证）
            - 包名仍是 `dev.pages.abts`，签名不变，**可直接覆盖安装**，桌面名称仍为「阿B听书」

            ### 本次更新

            - **全 APP 车机触控视觉放大（v1.4.32）**：
              - 参考 Android Auto / Android Automotive 触控规范（最小 76dp 目标、远距离清晰），全局放大可点击按钮的视觉图标尺寸
              - 全局 IconButton 视觉图标 24→28；PageScaffold 宽屏标题栏加高到 56dp，返回键 22→30，操作按钮 28
              - 播放页最小化 ▼ 34→42；底部迷你条展开 ▲ 26→30、播放键图标 36→40
              - 逐项放大其余显式小尺寸按钮：我的页退出/设置、发现页刷新、关注/搜索/缓存/书签/UP 主/显示调节/登录页的清除、删除、取消等按钮
              - 同步加高标题栏避免溢出，列表装饰性图标保持不动，不挤压文字、不重叠
            - **车机触控目标增大（v1.4.31）**：
              - 全局 IconButton 最小触摸目标从 32×32 提升到 48×48（Material 规范），视觉图标尺寸不变
              - 覆盖：播放页最小化按钮、各页返回键与 AppBar 操作按钮、缓存控制条/列表按钮、搜索清空历史、发现页刷新
              - PageScaffold 标题栏高度 44→48 避免按钮溢出，移除相关按钮的紧凑密度约束
            - **侧栏选中态去遮罩（v1.4.31）**：
              - 左侧导航选中项不再显示椭圆底色与描边，仅靠品牌色图标 + 加粗文字区分选中/未选中
            - **音频焦点修复（v1.4.29+38）**：
              - 导航播报：TRANSIENT 打断先 duck 到 30% 继续播放，3 秒内 GAIN 回来（导航必在此时段）→ 只恢复音量不暂停
              - 来电/语音助手：TRANSIENT 打断超 3 秒还没 GAIN → 真正 pause，挂断/结束后自动 resume
              - CAN_DUCK 提示音：继续 duck 到 30% 不中断
              - LOSS 永久抢占：立即 pause
            - **进度条对比度修复（v1.4.29+37）**：
              - 深色模式未活跃轨道从 #1E2E52 升级到 #4A6599（对比度 3.2:1）
              - 浅色模式未活跃轨道从 #C9DBF5 升级到 #6F8BB8（对比度 3.4:1）
              - player_page SliderTheme / cache_page LinearProgressIndicator / theme 默认值均已同步
            - **AudioFocus 回归修复（v1.4.29+37）**：
              - 恢复原始版标准语义，删除 v1.4.25 引入的 10s 延迟暂停窗口和 30s sleep 定时器
              - 保留车机专用修复：_playAllowed 门闩、handleScreenOff 熄屏暂停、reconnect 门闩检查
            - v1.4.28 修复延续：断流看门狗排除 buffering 态、精确播放状态日志

            ### 安装说明

            - 车机请优先下载 `arm64-v8a`；不确定架构时选 `universal`
            - APK 文件名统一以 `abts_car-` 开头，仅文件名变化，不影响安装与升级
            - 首次从官方版切换过来时签名不同，需先卸载旧版本（书架与进度会清空）

            通用包：`abts_car-v${{ steps.ver.outputs.version }}-universal.apk`
          files: build/app/outputs/flutter-apk/*.apk
          fail_on_unmatched_files: true

      # 历史 Release 全部保留：每次发布的「本次更新」即该版本的更新日志
