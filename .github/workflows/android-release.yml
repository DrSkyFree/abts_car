name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    # 文档类改动不必重新打包发布
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 固定 Flutter 版本：3.44.x 的 Dart 为 3.12，满足 pubspec.lock 的 SDK 约束；
      # 同时它的 Gradle 最低要求是 8.7（并且 8.14 以下才警告），与本项目
      # Gradle 8.14 / AGP 8.11.1 / Kotlin 2.2.20 完全匹配。
      # 若改用 channel: stable，会拉到 3.50+，要求 Gradle >= 9.3.1 而构建失败。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      # 固定签名：仓库内提交的是 keystore 的 base64 文本，构建前还原成文件。
      # 这样每次构建签名一致，后续版本可直接覆盖安装（升级）。
      - name: Restore signing keystore
        run: base64 -d android/abts-release.keystore.b64 > android/app/abts-release.keystore

      - name: Read version from pubspec
        id: ver
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Flutter pub get
        run: flutter pub get

      # 静态检查：能提前暴露打包时才报的编译错误（如漏掉 import）
      - name: Flutter analyze
        run: flutter analyze

      # 车机布局验收：1920x720 下的状态栏避让、字号、封面列数、即时生效
      - name: Flutter test
        run: flutter test

      - name: Build release APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          V="v${{ steps.ver.outputs.version }}"
          mv app-arm64-v8a-release.apk "abts_car-$V-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "abts_car-$V-armeabi-v7a.apk"
          mv app-x86_64-release.apk "abts_car-$V-x86_64.apk"
          mv app-release.apk "abts_car-$V-universal.apk"
          ls -lh *.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: abts-apk-v${{ steps.ver.outputs.version }}
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 阿B听书 v${{ steps.ver.outputs.version }}
          body: |
            ## 车机专用版 v${{ steps.ver.outputs.version }}

            本仓库为「阿B听书」车机专用分支，只适配 Android 车机中控。

            ### 适配范围

            - **最低 Android 7.0（API 24）**，覆盖停留在 7.0~9.0 的车机与车机盒子
            - 12~18 寸中控，720P ~ 2.5K 横屏（已在 Android 11 / 1920×720 验证）
            - 包名仍是 `dev.pages.abts`，签名不变，**可直接覆盖安装**，桌面名称仍为「阿B听书」

            ### 本次更新

            - **修复播放卡顿一秒又续播的残余通道**：
              - 断流看门狗不再在缓冲期间触发重连——网络抖动时位置不推进是正常缓冲，此前 40s 无进度就重连，重连过程造成「卡顿一秒又续播」
              - 音频焦点永久丢失（LOSS）也改为 10 秒延迟暂停窗口，和短暂打断（TRANSIENT）一致——车机 ROM 偶发把 LOSS 拆成「先 LOSS 又很快 GAIN」的竞态，此前直接 pause() 导致短暂抖动
            - **新增精确播放状态日志**：playing/buffering 变化都带时间戳，方便 logcat 抓包定位具体触发路径
            - v1.4.27 修复延续：断流重连绕过播放门闩、墙钟跳变误判休眠

            ### 安装说明

            - 车机请优先下载 `arm64-v8a`；不确定架构时选 `universal`
            - APK 文件名统一以 `abts_car-` 开头，仅文件名变化，不影响安装与升级
            - 首次从官方版切换过来时签名不同，需先卸载旧版本（书架与进度会清空）

            通用包：`abts_car-v${{ steps.ver.outputs.version }}-universal.apk`
          files: build/app/outputs/flutter-apk/*.apk
          fail_on_unmatched_files: true

      # 历史 Release 全部保留：每次发布的「本次更新」即该版本的更新日志
